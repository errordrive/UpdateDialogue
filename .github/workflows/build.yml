name: Android Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Android SDK 34 components
        run: |
          SDKMGR=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build standalone UpdateDialogue classes.dex
        run: |
          mkdir -p build/javac-out build/dex-out
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d build/javac-out \
            app/src/main/java/com/error/updatedialogue/UpdateDialogue.java
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --min-api 21 \
            --output build/dex-out \
            build/javac-out/com/error/updatedialogue/*.class

      - name: Upload APK and classes.dex artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UpdateDialogue-Build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/dex-out/classes.dex
