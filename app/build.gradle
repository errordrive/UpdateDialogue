plugins {
    id 'com.android.application'
}

// --- Locked remote link -------------------------------------------------
// Priority: -PdialogueRemoteUrl=... > DIALOGUE_REMOTE_URL env > dialogue.properties
def dialogueProps = new Properties()
def dialoguePropsFile = rootProject.file('dialogue.properties')
if (dialoguePropsFile.exists()) {
    dialoguePropsFile.withInputStream { dialogueProps.load(it) }
}
def dialogueRemoteUrl = (project.findProperty('dialogueRemoteUrl')
        ?: System.getenv('DIALOGUE_REMOTE_URL')
        ?: dialogueProps.getProperty('remote.url', '')).toString().trim()

def secureLinkFile = layout.projectDirectory
        .file('src/main/java/com/error/updatedialogue/SecureLinkConfig.java')

tasks.register('generateSecureLink', Exec) {
    inputs.property('remoteUrl', dialogueRemoteUrl)
    outputs.file(secureLinkFile)
    outputs.file(layout.projectDirectory
            .file('src/main/java/com/error/updatedialogue/MainActivity.java'))
    outputs.file(layout.projectDirectory.file('proguard-generated.pro'))
    outputs.file(layout.projectDirectory.file('src/main/assets/template_blob.txt'))
    commandLine 'python3',
            rootProject.file('tools/generate_secure_link.py').absolutePath,
            '--url', dialogueRemoteUrl,
            '--out', secureLinkFile.asFile.absolutePath
}
preBuild.dependsOn tasks.named('generateSecureLink')

// Standalone dialogue-only dex (R8-obfuscated) bundled as an asset so the
// in-app Generate button can export it into the output zip.
tasks.register('buildDialogueDex', Exec) {
    dependsOn tasks.named('generateSecureLink')
    inputs.file(layout.projectDirectory
            .file('src/main/java/com/error/updatedialogue/UpdateDialogue.java'))
    inputs.file(secureLinkFile)
    inputs.file(rootProject.file('generated/bridge-manifest.txt'))
    inputs.file(layout.projectDirectory.file('proguard-generated.pro'))
    inputs.file(layout.projectDirectory.file('proguard-dialogue-dex.pro'))
    outputs.file(layout.projectDirectory.file('src/main/assets/dialogue.dex'))
    commandLine 'python3',
            rootProject.file('tools/build_dialogue_dex.py').absolutePath
}
preBuild.dependsOn tasks.named('buildDialogueDex')
// ------------------------------------------------------------------------

android {
    namespace 'com.error.updatedialogue'
    compileSdk 34

    defaultConfig {
        applicationId "com.error.updatedialogue"
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "2.0"
    }

    signingConfigs {
        release {
            // Production keystore comes from CI secrets / env, never the repo.
            // Keystore must use an RSA key; APK Signature Scheme v2/v3 then
            // signs with SHA-256 digests automatically.
            def ksPath = System.getenv('RELEASE_KEYSTORE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            // R8: shrink + obfuscate. The locked link itself is never a
            // plain string (see SecureLinkConfig), R8 hides the rest.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
                    'proguard-generated.pro'
            // Real release keystore when provided, debug key for test builds.
            signingConfig(signingConfigs.release.storeFile != null
                    ? signingConfigs.release
                    : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // On-device dex rewriting for the Generate output (class renaming +
    // locked-link blob replacement).
    implementation 'org.smali:dexlib2:2.5.2'
    implementation 'com.google.guava:guava:27.1-android'
}
